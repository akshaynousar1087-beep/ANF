                        type="button"
                        onClick={() => setBookingForm({ ...bookingForm, budget: tier })}
                        className={`p-3 text-left rounded-md text-xs font-mono border transition-all ${
                          bookingForm.budget === tier 
                            ? 'bg-white text-black border-white font-bold' 
                            : 'bg-neutral-900 text-neutral-300 border-neutral-800 hover:border-neutral-700'
                        }`}
                      >
                        {tier}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label className="text-xs font-mono uppercase tracking-widest text-neutral-400 block mb-2">
                      Target Production Timeline
                    </label>
                    <select 
                      value={bookingForm.timeline}
                      onChange={(e) => setBookingForm({ ...bookingForm, timeline: e.target.value })}
                      className="w-full bg-neutral-900 border border-neutral-800 rounded px-3 py-2.5 text-xs text-white font-mono focus:border-[#F25623] outline-none"
                    >
                      <option>Immediate / Within 30 Days</option>
                      <option>Within 60 - 90 Days</option>
                      <option>Q3/Q4 2026 Production Slate</option>
                      <option>Long-Term Development (2026-27)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-mono uppercase tracking-widest text-neutral-400 block mb-2">
                      Primary Location / Shoot Territory
                    </label>
                    <select 
                      value={bookingForm.location}
                      onChange={(e) => setBookingForm({ ...bookingForm, location: e.target.value })}
                      className="w-full bg-neutral-900 border border-neutral-800 rounded px-3 py-2.5 text-xs text-white font-mono focus:border-[#F25623] outline-none"
                    >
                      <option>Kerala (Kollam / Kochi)</option>
                      <option>Bengaluru / Chennai (South Hub)</option>
                      <option>Mumbai / Pan-India Travel</option>
                      <option>International Location</option>
                      <option>Pure Post-Production / Remote</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-xs font-mono uppercase tracking-widest text-neutral-400 block mb-2">
                    Deliverables Scope Check
                  </label>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {[
                      "2.39:1 DCP Master",
                      "4K Color Grade",
                      "TVC 60s/30s Cuts",
                      "9:16 Social Suite",
                      "High-Res Stills Kit",
                      "Behind the Scenes Reel"
                    ].map(item => (
                      <button
                        key={item}
                        type="button"
                        onClick={() => toggleDeliverable(item)}
                        className={`px-3 py-2 rounded text-xs font-mono text-left border flex items-center justify-between transition-colors ${
                          bookingForm.deliverables.includes(item)
                            ? 'bg-neutral-800 text-white border-[#F25623]'
                            : 'bg-neutral-900/60 text-neutral-400 border-neutral-800'
                        }`}
                      >
                        <span>{item}</span>
                        {bookingForm.deliverables.includes(item) && (
                          <span className="text-[#F25623] font-bold">✓</span>
                        )}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-4 pt-4 border-t border-neutral-800">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input 
                      type="text" 
                      placeholder="Your Name / Studio"
                      value={bookingForm.clientName}
                      onChange={(e) => setBookingForm({ ...bookingForm, clientName: e.target.value })}
                      className="bg-neutral-900 border border-neutral-800 rounded px-3 py-2.5 text-xs text-white focus:border-[#F25623] outline-none"
                    />
                    <input 
                      type="email" 
                      placeholder="Email Address"
                      value={bookingForm.clientEmail}
                      onChange={(e) => setBookingForm({ ...bookingForm, clientEmail: e.target.value })}
                      className="bg-neutral-900 border border-neutral-800 rounded px-3 py-2.5 text-xs text-white focus:border-[#F25623] outline-none"
                    />
                    <input 
                      type="tel" 
                      placeholder="WhatsApp / Phone"
                      value={bookingForm.clientPhone}
                      onChange={(e) => setBookingForm({ ...bookingForm, clientPhone: e.target.value })}
                      className="bg-neutral-900 border border-neutral-800 rounded px-3 py-2.5 text-xs text-white focus:border-[#F25623] outline-none"
                    />
                  </div>

                  <textarea 
                    rows={3}
                    placeholder="Brief project vision, reference tone, or requirements..."
                    value={bookingForm.projectBrief}
                    onChange={(e) => setBookingForm({ ...bookingForm, projectBrief: e.target.value })}
                    className="w-full bg-neutral-900 border border-neutral-800 rounded p-3 text-xs text-white focus:border-[#F25623] outline-none"
                  />
                </div>

                <div className="p-4 rounded bg-neutral-900/80 border border-neutral-800 font-mono text-[11px] text-neutral-300">
                  <div className="flex items-center justify-between text-neutral-500 mb-2">
                    <span>COMPILED PRODUCTION BRIEF</span>
                    <span className="text-[#F25623]">READY FOR DISPATCH</span>
                  </div>
                  <div className="whitespace-pre-line text-neutral-200">
                    {generateBriefSummary()}
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row items-center gap-3 pt-2">
                  <button
                    type="button"
                    onClick={handleWhatsAppDispatch}
                    className="w-full sm:flex-1 py-3 bg-[#25D366] hover:bg-[#20ba5a] text-black font-bold text-xs uppercase tracking-wider rounded transition-colors flex items-center justify-center gap-2"
                  >
                    <span>Dispatch via WhatsApp Directly</span>
                  </button>

                  <button
                    type="button"
                    onClick={handleCopyBrief}
                    className="w-full sm:w-auto px-5 py-3 bg-neutral-800 hover:bg-neutral-700 text-white font-mono text-xs uppercase tracking-wider rounded border border-neutral-700 transition-colors flex items-center justify-center gap-2"
                  >
                    {copiedBrief ? <span>✓ Brief Copied!</span> : <span>Copy Raw Brief</span>}
                  </button>

                  <a
                    href={`mailto:${LEGAL_DATA.email}?subject=Production%20Inquiry%20-%20${bookingForm.engagement}&body=${encodeURIComponent(generateBriefSummary())}`}
                    className="w-full sm:w-auto px-5 py-3 bg-neutral-900 hover:bg-neutral-800 text-neutral-300 font-mono text-xs uppercase tracking-wider rounded border border-neutral-700 transition-colors flex items-center justify-center gap-2"
                  >
                    <span>Send Email</span>
                  </a>
                </div>

              </div>
            </div>
          </section>

          {/* Master Footer */}
          <footer className="border-t border-white/10 bg-[#070708] py-16 px-4 md:px-8 text-neutral-400">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-start justify-between gap-12">
              
              <div className="max-w-md space-y-4">
                <div className="bg-white p-3 rounded-lg border border-neutral-700 inline-block shadow-md">
                  <OriginalLogo id="anf" className="h-10 w-auto" alt="Akshay Noushar Films" />
                </div>
                <p className="text-xs leading-relaxed text-neutral-400">
                  The flagship cinematic banner of Akshay Noushar. Dedicated to auteur-driven motion pictures, commercial productions, and modular creative technology.
                </p>
                <div className="text-[11px] font-mono text-neutral-500 space-y-1 pt-2">
                  <div>Govt. MSME: {LEGAL_DATA.msme}</div>
                  <div>GSTIN: {LEGAL_DATA.gst} (DayNight Media)</div>
                  <div>Operating out of: {LEGAL_DATA.address}</div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-8 text-xs font-mono">
                <div>
                  <div className="text-white uppercase tracking-widest text-[11px] mb-3 font-bold">
                    Ecosystem
                  </div>
                  <ul className="space-y-2 text-neutral-400">
                    <li><a href="#matrix" className="hover:text-[#F25623]">ANF Originals</a></li>
                    <li><a href="#matrix" className="hover:text-[#F25623]">OBSCURA Viewfinder</a></li>
                    <li><a href="#matrix" className="hover:text-[#F25623]">DayNight Media (DNM)</a></li>
                    <li><a href="https://flickus.in" target="_blank" rel="noreferrer" className="hover:text-[#F25623]">FlickUs Creatives</a></li>
                    <li><a href="#matrix" className="hover:text-[#F25623]">Flicker Frame Films</a></li>
                    <li><a href="#matrix" className="hover:text-[#F25623]">Cinema Paradise</a></li>
                    <li><a href="#matrix" className="hover:text-[#F25623]">Eleven Story</a></li>
                  </ul>
                </div>

                <div>
                  <div className="text-white uppercase tracking-widest text-[11px] mb-3 font-bold">
                    Channels
                  </div>
                  <ul className="space-y-2 text-neutral-400">
                    <li>
                      <a href="https://www.instagram.com/akshaynoushar_films/" target="_blank" rel="noreferrer" className="hover:text-[#F25623]">
                        @akshaynoushar_films
                      </a>
                    </li>
                    <li>
                      <a href="https://www.instagram.com/daynightmedia.co?hl=el" target="_blank" rel="noreferrer" className="hover:text-[#F25623]">
                        @daynightmedia.co
                      </a>
                    </li>
                    <li>
                      <a href="https://www.instagram.com/flicker_frame_films/" target="_blank" rel="noreferrer" className="hover:text-[#F25623]">
                        @flicker_frame_films
                      </a>
                    </li>
                    <li>
                      <a href="https://flickus.in/" target="_blank" rel="noreferrer" className="hover:text-[#F25623]">
                        flickus.in
                      </a>
                    </li>
                  </ul>
                </div>
              </div>

              <div className="space-y-3">
                <div className="text-white uppercase tracking-widest text-[11px] font-bold">
                  Direct Production Line
                </div>
                <div className="text-sm font-mono text-[#F25623] font-bold">
                  {LEGAL_DATA.email}
                </div>
                <div className="text-xs font-mono text-neutral-300">
                  {LEGAL_DATA.phone}
                </div>
                <div className="pt-2">
                  <a 
                    href="#booking"
                    className="inline-flex items-center gap-2 px-4 py-2 bg-neutral-900 hover:bg-neutral-800 text-neutral-200 border border-neutral-700 rounded text-xs font-mono uppercase tracking-wider"
                  >
                    <span>Book Calibration →</span>
                  </a>
                </div>
              </div>

            </div>

            <div className="max-w-7xl mx-auto mt-12 pt-8 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between text-[11px] font-mono text-neutral-500 gap-4">
              <div>
                © 2019 - 2026 Akshay Noushar Films (ANF). All Rights Reserved.
              </div>
              <div>
                Built from the final frame · Kollam, Kerala
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
